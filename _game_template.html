const IMG = __ASSETS_JSON__;
const AUDIO = __AUDIO_JSON__;   // {5:'base64...',...}；为空时退回 music/<age>.mp3

/* ------------------------- 画布 / 响应式铺满 ------------------------- */
const W = 480, H = 270;                 // 设计坐标基准（16:9 基准，可视区随窗口扩展）
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let PX = 1;                             // 渲染精度 1/2/3
let mult = 1, scale = 1, K = 1;
let VIEW = {x:0,y:0,w:W,h:H,scale:1,k:1};
const TITLE_BG = '#a6e9e6';

function applyDensity(){ resize(); }
function resize(){
  const cw = Math.max(320, window.innerWidth|0), ch = Math.max(240, window.innerHeight|0);
  mult = Math.max(1, Math.round((window.devicePixelRatio||1)*PX));
  canvas.width = Math.round(cw*mult);
  canvas.height = Math.round(ch*mult);
  const s = Math.min(cw/W, ch/H);
  scale = s >= 1 ? Math.floor(s) : s;          // 整数倍优先；极窄窗口允许 <1
  K = scale*mult;
  const vw = cw/scale, vh = ch/scale;
  VIEW = {x:(W-vw)/2, y:(H-vh)/2, w:vw, h:vh, scale, k:K};
  ctx.setTransform(K,0,0,K, -VIEW.x*K, -VIEW.y*K);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

function toCanvas(e){
  const r = canvas.getBoundingClientRect();
  return {x:VIEW.x + (e.clientX-r.left)/scale, y:VIEW.y + (e.clientY-r.top)/scale};
}
function setPixelDensity(p){
  PX = Math.max(1, Math.min(3, p|0));
  resize();
}
function setTransform(){
  ctx.setTransform(K,0,0,K, -VIEW.x*K, -VIEW.y*K);
  ctx.imageSmoothingEnabled = false;
}

/* ------------------------- 图片资源 ------------------------- */
const IM = {};
for (const k in IMG){ const i = new Image(); i.src = IMG[k]; IM[k] = i; }
function ready(k){ const i=IM[k]; return !!i && i.complete && i.naturalWidth>0; }
function D(key,x,y,w,h,alpha,smooth){
  if(!ready(key)) return false;
  const prev = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = !!smooth;
  if(alpha!==undefined && alpha!==1){ ctx.globalAlpha=alpha; ctx.drawImage(IM[key],x,y,w,h); ctx.globalAlpha=1; }
  else ctx.drawImage(IM[key],x,y,w,h);
  ctx.imageSmoothingEnabled = prev;
  return true;
}
function Dcover(key,x,y,w,h,smooth){
  if(!ready(key)) return false;
  const i=IM[key], ir=i.width/i.height, tr=w/h;
  let sw,sh,sx,sy;
  if(ir>tr){ sh=i.height; sw=sh*tr; sx=(i.width-sw)/2; sy=0; }
  else { sw=i.width; sh=sw/tr; sx=0; sy=(i.height-sh)/2; }
  const prev=ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled=!!smooth;
  ctx.drawImage(i,sx,sy,sw,sh,x,y,w,h);
  ctx.imageSmoothingEnabled=prev; return true;
}
function Dfit(key,x,y,w,h,smooth){
  if(!ready(key)) return false;
  const i=IM[key], s=Math.min(w/i.width,h/i.height);
  const dw=i.width*s, dh=i.height*s;
  return D(key, x+(w-dw)/2, y+(h-dh)/2, dw, dh, undefined, smooth);
}

/* ------------------------- 绘制基础 ------------------------- */
const C = {
  ink:'#182a4a', navy:'#151f45', white:'#ffffff', cream:'#fff7ee', silver:'#d9e2ee',
  blueD:'#24509c', blue:'#3b7fd4', blueL:'#7ec8ef', skyL:'#bfeaf7', cyan:'#a8e9e6',
  pink:'#ff8fc7', pinkD:'#e35fa8', gold:'#f6c344', green:'#59c26d', greenD:'#2f8f4e',
  gray:'#8b97a8', grayD:'#4c5870', red:'#e0524a', brown:'#8a5a45', purple:'#8b5ad0',
  greenL:'#8ee39b', greenD:'#2f8f4e'
};
/* 悬浮框玻璃质感：底色 0.14 = 86% 透明，是「还能看出框的范围」的下限；
   文字可读性不再依赖底板，改由 TIP_HALO 的 1px 亮描边保证。 */
const TIP_BG    = 'rgba(255,247,238,0.14)';
const TIP_HALO  = 'rgba(255,250,242,0.94)';
const TIP_EDGE  = 'rgba(24,42,74,0.34)';
const TIP_LIGHT = 'rgba(255,255,255,0.58)';
const FONT = '"DDPixel","Microsoft YaHei","PingFang SC","SimHei",sans-serif';
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); }
function Rf(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function border(x,y,w,h,c,t){ t=t||1; Rf(x,y,w,t,c);Rf(x,y+t,t,h-2*t,c);Rf(x+w-t,y+t,t,h-2*t,c);Rf(x,y+h-t,w,t,c); }
function bevel(x,y,w,h,face,light,shadow){
  light=light||C.white; shadow=shadow||C.ink;
  Rf(x,y,w,h,shadow); Rf(x,y,w-1,h-1,face); Rf(x,y,w,1,light); Rf(x,y,1,h,light);
}
function ptext(str,x,y,s,color,bold){
  ctx.font=(7*s)+'px '+FONT; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillStyle=color;
  const t=String(str).toUpperCase(); ctx.fillText(t,x,y);
  if(bold) ctx.fillText(t,x+Math.max(1,s*0.34),y);
}
function ptextW(str,s){
  // 按真实字形宽度测量，不能用「每字符 7*s」硬估：DDPixel 的 advance 远小于字号
  ctx.font=(7*s)+'px '+FONT;
  return ctx.measureText(String(str).toUpperCase()).width;
}
function ptextC(str,cx,y,s,color,bold){
  // bold 会向右重画一次，可见区域略宽，一并补偿，保证视觉中心严格落在 cx
  const w=ptextW(str,s)+(bold?Math.max(1,s*0.34):0);
  ptext(str,cx-w/2,y,s,color,bold);
}
function ctext(str,x,y,size,color,align,shadow,bold){
  ctx.font=size+'px '+FONT; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  if(shadow!==false){ ctx.fillStyle=C.ink; ctx.fillText(str,x+1,y+1); }
  ctx.fillStyle=color; ctx.fillText(str,x,y);
  if(bold) ctx.fillText(str,x+1,y);
}
function wrap(str,maxW,size){
  ctx.font=size+'px '+FONT;
  const words=String(str).split(' '); const lines=[]; let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; }
    else cur=t;
  }
  if(cur) lines.push(cur);
  return lines;
}
/* 超长单词（或像素字体量出的超宽行）硬裁成省略号，保证永不溢出弹窗 */
function fitLine(str,maxW,size){
  ctx.font=size+'px '+FONT;
  let s=String(str);
  if(ctx.measureText(s).width<=maxW) return s;
  while(s.length>1 && ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1);
  return s+'…';
}
/* 深色描边字：草绿色桌面壁纸上也能读清 */
function ctextOutline(str,x,y,size,color,align,width){
  ctx.font=size+'px '+FONT; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  const o=width||1;
  ctx.fillStyle='rgba(12,22,48,0.92)';
  for(let dx=-o;dx<=o;dx++) for(let dy=-o;dy<=o;dy++)
    if(dx||dy) ctx.fillText(str,x+dx,y+dy);
  ctx.fillStyle=color; ctx.fillText(str,x,y);
}
/* 浅色描边字：悬浮框底色高透明后，深色文字在深色背景上仍要靠这圈亮边读清。
   只烘一圈 1px 亮边，不铺色块，所以不会把刚去掉的底板又盖回来。 */
function ctextHalo(str,x,y,size,color,align,width,bold){
  ctx.font=size+'px '+FONT; ctx.textAlign=align||'left'; ctx.textBaseline='top';
  const o=width||1;
  ctx.fillStyle=TIP_HALO;
  for(let dx=-o;dx<=o;dx++) for(let dy=-o;dy<=o;dy++)
    if(dx||dy) ctx.fillText(str,x+dx,y+dy);
  ctx.fillStyle=color; ctx.fillText(str,x,y);
  if(bold) ctx.fillText(str,x+1,y);
}

/* ------------------------- 点击区域 ------------------------- */

function reg(key,x,y,w,h,fn){ regions.push({key,x,y,w,h,fn}); }
function hit(x,y){
  for(let i=regions.length-1;i>=0;i--){ const r=regions[i];

}

/* 分支变体：按 state.choices 动态决定图标 / 弹窗图 / 穿戴图层 */
function resolveKey(item, field){
  let k = item[field];
  // 8 岁图画本：物品栏固定用「8岁图画本像素.png」（合上的本子）；
  // 只有弹窗大图与穿戴图层按 5 岁雏菊分支换成「打开的图画本」两个版本
  if(k==='a8sketchBig')      k = state.choices.daisy ? 'T_sketch_yes' : 'T_sketch_no';
  if(k==='a8sketchLayer')    k = state.choices.daisy ? 'L_sketch_yes' : 'L_sketch_no';
  if(k==='a18macBig')        k = state.choices.gem ? 'T_macbook_diamond' : 'T_a18_macbook';
  if(k==='a18macIcon')       k = state.choices.gem ? 'T_macbook_diamond' : 'T_a18_macbook';
  if(k==='a18macLayer')      k = state.choices.gem ? 'L_macbook_diamond' : 'L_a18_macbook';
  if(k==='BIG_a12_notebook') k = state.choices.notebook ? 'T_notebook_sticker' : 'T_notebook_open';
  return k;
}
/* ------------------------- 手持 / 使用中的道具 -------------------------
 * 设计稿里这些是浮在人物立绘左右两侧的独立插画，不是 360×518 全身对齐图层。
 * PROP_PLACE 是相对换装窗口 win 的归一化矩形，数值来自设计稿最终效果图
 * （image36 / image52 / image70）叠加 5% 网格量测，与文档「左侧上方 /
 * 右侧下方」等描述一致。P_ 资源已在构建时按 alpha 紧裁掉四周留白。
 * ------------------------------------------------------------------- */
const PROP_PLACE = {
  a8_gem:       {x:0.355, y:0.485, w:0.180, h:0.300},  // 抓着手里的宝石 · 人物右侧中下
  a8_sketch:    {x:0.025, y:0.215, w:0.225, h:0.255},  // 打开的图画本 · 人物左侧上方
  a12_notebook: {x:0.005, y:0.165, w:0.225, h:0.300},  // 翻开的笔记本 · 人物左侧上方
  a12_ipad:     {x:0.345, y:0.395, w:0.170, h:0.340},  // 使用中的 iPad · 人物右侧下方
  a15_nails:    {x:0.350, y:0.095, w:0.185, h:0.270},  // 戴手上的穿戴甲 · 人物右侧上方
  a15_ipad:     {x:0.010, y:0.415, w:0.195, h:0.385},  // iPad 画作 · 人物左侧下方
};
const PROP_LAYER = {
  a8_gem:       ()=>'P_gem_hand',
  a8_sketch:    ()=>state.choices.daisy?'P_sketch_yes':'P_sketch_no',
  a12_ipad:     ()=>'P_ipad12',
  a12_notebook: ()=>state.choices.notebook?'P_notebook_sticker':'P_notebook_open',
  a15_nails:    ()=>'P_nails_hand',
  a15_ipad:     ()=>'P_ipad15',
};
function layerKeyOf(item){
  const f=PROP_LAYER[item.id];
  return f ? f() : resolveKey(item,'layer');
}
/* 需要画在「人物图层之下」的道具：PROP_PLACE 的手持/使用中道具，
   以及 18 岁书堆 / MacBook（源图本身就是按人物全画布定位好的独立插画）。
   先画这些、再画人物、最后画服饰，道具就不会遮盖人物与衣服。 */
function isBehind(item){ return !!item.behind || !!PROP_PLACE[item.id]; }
/* 图层排序规则：18 岁「蓝色染发」是覆盖整个头部的图层(z=60)，
   会把耳环(z=52)压在下面，导致戴了染发后两耳看不到任何耳饰。
   规则：染发与任意耳环同时穿戴时，把耳环临时提到染发之上；
   没戴染发时所有物品仍按原有 z 层次，不影响其它配饰的遮挡关系。 */
function layerZ(item, wornList){
  const dye = wornList.find(x=>x.id==='a18_hairdye');
  return (dye && item.slot==='ears') ? Math.max(item.z, dye.z+1) : item.z;
}

/* ------------------------- 状态 ------------------------- */
const state = {
  screen:'TITLE', unlocked:1, completed:[false,false,false,false,false],
  saved:[null,null,null,null,null], age:0, worn:{}, slotOwner:{},
  choices:{daisy:false,gem:false,notebook:false,remake:false},
  makeup:[false,false,false,false,false],
  modal:null, startMenu:false, muted:false, freePlay:false,
  endingShown:false,  // 谢幕只播一次：集齐 5 个存档点后重进换装再保存不重播
  endingTick:0, saveAnim:0, hoverItem:null, tip:null,
  drag:null,          // 拖拽穿戴：{item, from:'wardrobe'|'char', x, y}
};
function resetAll(){
  state.screen='TITLE'; state.unlocked=1; state.completed=[false,false,false,false,false];
  state.saved=[null,null,null,null,null]; state.age=0; state.worn={}; state.slotOwner={};
  state.choices={daisy:false,gem:false,notebook:false,remake:false};
  state.makeup=[false,false,false,false,false];
  state.modal=null; state.startMenu=false; state.freePlay=false;
  state.endingShown=false;
  state.endingTick=0; state.saveAnim=0; state.hoverItem=null; state.tip=null;
  state.drag=null;
  stopMusic();
}
function snapshot(){
  return {worn:Object.assign({},state.worn), slotOwner:Object.assign({},state.slotOwner),
          choices:Object.assign({},state.choices), makeup:state.makeup.slice()};
}
function restore(s){
  // choices 是跨存档点的全局叙事状态，不从单个旧存档回滚（否则改了 5 岁选择会被 8 岁快照覆盖）
  if(!s) { state.worn={}; state.slotOwner={}; state.makeup=[false,false,false,false,false]; }
  else {
    state.worn=Object.assign({},s.worn); state.slotOwner=Object.assign({},s.slotOwner);
    state.makeup=(s.makeup||[]).slice();
  }
  // 分支被改回「没画画」后，旧存档里穿上的 REMAKE T恤必须一并脱下
  pruneHiddenWear();
}
/* 条件物品：依赖项未发生的分支物品不进物品栏，也不占人物穿戴槽 */
function itemAvailable(item){
  return !item.requires || !!state.choices[item.requires];
}
function pruneHiddenWear(){
  WARDROBES.forEach(list=>list.forEach(item=>{
    if(itemAvailable(item)) return;
    delete state.worn[item.id];
    if(item.slot && state.slotOwner[item.slot]===item.id) delete state.slotOwner[item.slot];
  }));
}
function folderOpen(i){ return state.freePlay || i < state.unlocked; }

/* ------------------------- 音乐 ------------------------- */
let audio = null, musicURLs = {}, musicReady=false, blobCache={};
function ensureAudio(){
  if(!audio){ audio=new Audio(); audio.loop=true; audio.volume=0.55; }
  return audio;
}
/* 内联的 mp3 先转 Blob URL 再交给 Audio：file:// 下也不会被 data URL 长度限制卡住，
   且按年龄段懒解码，不会一次性解 5 首歌。 */
function audioURL(age){
  const b64=AUDIO[age];
  if(!b64) return 'music/'+age+'.mp3';
  if(blobCache[age]) return blobCache[age];
  try{
    const bin=atob(b64), n=bin.length, u=new Uint8Array(n);
    for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i);
    blobCache[age]=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}));
    return blobCache[age];
  }catch(e){ return 'music/'+age+'.mp3'; }
}
function musicSrc(age){ return musicURLs[age] || audioURL(age); }
function playMusic(){
  if(state.screen!=='DRESSUP' || state.muted) return;
  const a=ensureAudio(), src=musicSrc(AGES[state.age].age);
  try{
    if(a.src!==new URL(src,location.href).href){ a.src=src; }
    const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){}
}
function pauseMusic(){ if(audio) try{audio.pause();}catch(e){} }
function stopMusic(){ pauseMusic(); if(audio) try{audio.currentTime=0;}catch(e){} }
function toggleMusic(){
  state.muted=!state.muted;
  if(state.muted) pauseMusic(); else playMusic();
}
document.getElementById('musicPick').addEventListener('change',e=>{
  const fs=Array.from(e.target.files||[]);
  [5,8,12,15,18].forEach(age=>{
    const f=fs.find(f=>new RegExp('^'+age+'[^0-9]').test(f.name));
    if(f) musicURLs[age]=URL.createObjectURL(f);
  });
  if(fs.length){ musicReady=true; if(!state.muted) playMusic(); }
  infoModal('MUSIC LOADED',[fs.length+' AUDIO FILE(S) READY.','MATCHED BY FILENAME PREFIX 5/8/12/15/18.']);
});

/* ------------------------- 弹窗 ------------------------- */
function infoModal(title,lines,opts){
  state.modal=Object.assign({kind:'info',title,lines},opts||{});
}
function lockedModal(i){
  state.modal={kind:'info',title:'SAVE SLOT LOCKED',
    lines:['THE '+AGES[i].label+' SAVE SLOT IS STILL LOCKED.','FINISH THE PREVIOUS SAVE SLOT FIRST.']};
}
function openItemModal(item){
  state.modal={kind:'item',item};
}
function openChoiceModal(item){
  // 详情 + 选项已合并为「一个弹窗」：标题栏放名称，上半放物品图，下半放选项素材。
  state.modal={kind:'choice',item};
}
function closeModal(){ state.modal=null; }

/* ------------------------- 穿戴逻辑 ------------------------- */
function wear(item){
  if(item.slot==='makeup'){ state.makeup[state.age]=!state.makeup[state.age]; return; }
  if(item.slot){
    const cur=state.slotOwner[item.slot];
    // 「再次点击同件脱下」必须同时满足槽位归属与确实穿在身上。
    // 只判断 cur===item.id 时，若 worn 与 slotOwner 因旧存档/跨存档点出现不一致，
    // 点击会被误判成脱下，表现为「耳环来回切几次后再也戴不上」。
    if(cur===item.id && state.worn[item.id]){
      delete state.worn[item.id]; delete state.slotOwner[item.slot]; return;
    }
    // 同槽只保留一件：清掉所有残留（包括其它年龄段带来的旧耳环）
    for(const id in state.worn){
      const other=ITEM_BY_ID[id];
      if(other && other.slot===item.slot) delete state.worn[id];
    }
    state.slotOwner[item.slot]=item.id;
  }
  state.worn[item.id]=true;
}
/* 物品栏、人物穿戴图层都以「当前可见物品」为准：
   12 岁没选 DRAW PICTURES → 15 岁不出现 REMAKE T恤 */
function currentItems(){ return WARDROBES[state.age].filter(itemAvailable); }

/* ------------------------- 拖拽穿戴 -------------------------
 * 只有 kind==='wear' 走拖拽：从衣橱图标按住 → 拖到人物立绘上松手即穿上；
 * 穿上后衣橱里那一格的服饰图片隐藏，想脱下就从人物身上按住往外拖。
 * 非可穿戴物品（雏菊/宝石/口红/化妆品/化妆袋/iPad/图画本/笔记本/
 * MacBook/书堆等 choice·popup·makeup·display·tip）仍是单击交互，不受影响。
 * ------------------------------------------------------------------- */
function draggable(item){ return item.kind==='wear' && itemAvailable(item); }
/* 已穿上的可穿戴物品从衣橱隐藏；choice/popup 也会写 state.worn，
   但它们是「使用中道具」，图标必须继续留在物品栏里。
   例外：REMAKE T恤虽是 choice，一旦穿上就是一件衣服（hideWhenWorn），
   按可穿戴物品处理——衣橱格隐藏，并可从人物身上拖出脱下。 */
function takeOffable(item){ return item.kind==='wear' || !!item.hideWhenWorn; }
function wardrobeHidden(item){ return takeOffable(item) && !!state.worn[item.id]; }
function wornWearList(){
  const worn = currentItems().filter(x=>takeOffable(x) && state.worn[x.id]);
  return worn.slice().sort((a,b)=>layerZ(a,worn)-layerZ(b,worn));
}
function wornWearAt(x,y){
  // 按住人物时决定要拖走哪一件：先找指针落在哪个手持道具矩形里，
  // 否则按 z 取最上层的一件（叠加式衣服图层无法按像素区分，逐次拖出即可）。
  const win=winRect(), list=wornWearList();
  const prop=list.find(item=>{
    const p=PROP_PLACE[item.id]; if(!p) return false;
    return x>=win.x+win.w*p.x && x<=win.x+win.w*(p.x+p.w)
        && y>=win.y+win.h*p.y && y<=win.y+win.h*(p.y+p.h);
  });
  return prop || list[list.length-1] || null;
}
function removeWear(item){
  if(!item) return;
  delete state.worn[item.id];
  if(item.slot && state.slotOwner[item.slot]===item.id) delete state.slotOwner[item.slot];
}
function beginDrag(from,item,x,y){ state.drag={from,item,x,y}; }
function moveDrag(x,y){ if(state.drag){ state.drag.x=x; state.drag.y=y; } }
function endDrag(x,y){
  const d=state.drag; state.drag=null;
  if(!d || state.screen!=='DRESSUP' || state.modal) return;
  const inside=inChar(x,y);
  if(d.from==='wardrobe'){
    if(!inside || !draggable(d.item) || !itemAvailable(d.item)) return;  // 拖到别处＝取消
    if(!state.worn[d.item.id]) wear(d.item);   // 同槽互斥仍由 wear() 处理
  } else if(d.from==='char'){
    if(!inside) removeWear(d.item);            // 拖出人物区域＝脱下，图标回到衣橱
  }
}
function cancelDrag(){ state.drag=null; }

/* ------------------------- 场景 / 窗口几何 ------------------------- */
function winRect(){
  const vw=VIEW.w, vh=VIEW.h;
  let w=Math.min(vw*0.80, vh*1.5*0.90), h=w/1.5;
  if(h>vh*0.90){ h=vh*0.90; w=h*1.5; }
  return {x:VIEW.x+(vw-w)*0.62, y:VIEW.y+(vh-h)/2, w, h};
}
function charRect(win){
  // 立绘放大到 0.92 倍窗口高：360×518 图层底部约 5.4% 是透明留白，
  // 脚实际落在 94.6% 处。放大后脚位于 win.y+0.875h，正好踩在换装台
  // 圆台顶面（stage 图层 y≈0.846~1.0），不再悬空。衣服图层同矩形对齐叠加。
  // 前四个年龄段立绘整体右移一点，视觉上更靠圆台中心；18 岁保持原位。
  const ch=win.h*0.920, cw=ch*(360/518);
  const cx = state.age<4 ? 0.31 : 0.285;
  return {x:win.x+win.w*cx-cw/2, y:win.y+win.h*0.005, w:cw, h:ch};
}
function inChar(x,y){
  const cr=charRect(winRect());
  return x>=cr.x && x<=cr.x+cr.w && y>=cr.y && y<=cr.y+cr.h;
}
/* 存档按钮：原来是 92×60 放在窗口左下角，先缩到 46×30，再按需求缩到 34×22。
   水平仍居中于「换装台」圆台（5 张素材 alpha 包围盒 x 0.152~0.447，中心 0.2995），
   但不再与圆台中心 (y 0.921) 对齐：下移到 y 0.95，让按钮顶边落在最深脚底
   （源图 97.7% × 立绘 92% → 窗口 90.4%）之下，不再压住人物鞋子；底边仍在窗口内。 */
const SAVE_BTN = {w:34, h:22, cx:0.2995, cy:0.95};
function saveBtnRect(win){
  return {x:win.x+win.w*SAVE_BTN.cx-SAVE_BTN.w/2,
          y:win.y+win.h*SAVE_BTN.cy-SAVE_BTN.h/2,
          w:SAVE_BTN.w, h:SAVE_BTN.h};
}
function wardrobeRect(win){
  return {x:win.x+win.w*0.565, y:win.y+win.h*0.075,
          w:win.w*0.405, h:win.h*0.85};
}
function gridOf(win){
  const wr=wardrobeRect(win), layout=WARDROBE_LAYOUT[state.age];
  // 行列数与每个格位的物品由 WARDROBE_LAYOUT 决定（对照设计稿效果图），
  // 不再按物品数量自动换行；空格位与未解锁的条件物品都留空、不挤压其它物品。
  const rows=layout.length, cols=layout[0].length;
  const pad=10, head=22, foot=8;
  const gw=(wr.w-pad*2)/cols, gh=(wr.h-head-foot-pad)/rows;
  const cellW=Math.min(gw,88), cellH=Math.min(gh,96);
  const ox=wr.x+(wr.w-cols*cellW)/2;
  const oy=wr.y+head+(wr.h-head-rows*cellH)/2;
  const cells=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const id=layout[r][c], item=id?ITEM_BY_ID[id]:null;
    if(!item || !itemAvailable(item)) continue;
    cells.push({x:ox+c*cellW, y:oy+r*cellH, w:cellW, h:cellH,
                item, idx:cells.length, col:c, row:r});
  }
  return {wr,cols,rows,cells,pad,head,layout};
}
function folderGeom(){
  // 左侧单列竖排 5 个：名称在图标正下方、无状态文字。
  // 图标尽量放大（上限 1.8 倍 = 38→68.4），但「5 个连名称一起不超出任务栏」
  // 是硬约束：16:9 满屏时设计视口高只有 270，每格约 49，图标最大约 42；
  // 视口更高的窗口会一路放大到 1.8 倍。任何情况下都不会裁掉第 5 个文件夹。
  const top=VIEW.y+3, bottom=taskbarY()-2;
  const slotH=(bottom-top)/5;
  const nameH=7, gap=1;
  const iconH=Math.max(20, Math.min(38*1.8, slotH-nameH-gap));
  const iconW=iconH*(26/38);
  return {top, slotH, iconW, iconH, nameH, gap,
          w:Math.max(96, iconW+16), x:VIEW.x+8};
}
function folderCell(i){
  const g=folderGeom();
  return {x:g.x, y:g.top+i*g.slotH, w:g.w, h:g.slotH-1, g};
}
function folderLabel(i){ return AGES[i].label+' SAVE SLOT'; }
function taskbarY(){ return VIEW.y+VIEW.h-20; }

/* ------------------------- 标题页 ------------------------- */
function drawTitle(){
  vFill(TITLE_BG);
  const cx=VIEW.x+VIEW.w/2, cy=VIEW.y+VIEW.h/2;
  const iw=96, ih=84;
  const ix=cx-iw/2, iy=cy-ih/2;
  // 设计稿：电脑图标固定，只有「发光字 START」在屏幕上浮动
  const bob=Math.sin(tick/22)*3;
  D('computer', ix, iy, iw, ih, undefined, false);        // 电脑：钉死不动
  D('startGlow', ix, iy+bob, iw, ih, undefined, false);   // START：单独浮动
  ctext('SAVE SLOT', VIEW.x+10, VIEW.y+8, 11, C.blueD, 'left', false);
  // START 的命中区跟着浮动走（Start.png 的 bbox 是 64x56 画布里的 x18~42 / y11~19）
  const sx=ix+iw*(18/64)-2, sy=iy+ih*(11/56)-2+bob;
  const sw=iw*(24/64)+4,    sh=ih*(8/56)+4;
  if(hoverKey==='title:start'){
    Rf(sx,sy,sw,sh,'rgba(255,255,255,0.32)');
    border(sx,sy,sw,sh,C.pinkD,1);
  }
  // 提示文字常驻、不再闪烁：一排小字固定在电脑图标下方
  ptextC('CLICK TO START', cx, cy+ih/2+18, 2, C.blueD, true);
  // 整页 / 电脑 / START 都能进桌面；START 最后注册，hover 才会命中它
  vBlock(()=>{ state.screen='DESKTOP'; });
  reg('title:go', ix, iy, iw, ih, ()=>{ state.screen='DESKTOP'; });
  reg('title:start', sx, sy, sw, sh, ()=>{ state.screen='DESKTOP'; });
}

/* ------------------------- XP 桌面 ------------------------- */
function drawDesktop(){
  Dcover('desk', VIEW.x,VIEW.y,VIEW.w,VIEW.h, false);
  for(let i=0;i<5;i++) drawFolder(i);
  drawTaskbar();
  if(state.saveAnim>0){
    const t=state.saveAnim/24;
    const c=folderCell(Math.max(0,state.age)), g=c.g;
    const ix=c.x+(c.w-g.iconW)/2;
    Rf(ix+(g.iconW*(1-t))/2, c.y+(g.iconH*(1-t))/2,
       g.iconW*t, g.iconH*t, 'rgba(255,255,255,0.55)');
    state.saveAnim--;
  }
}
function drawFolder(i){
  const c=folderCell(i), g=c.g, open=folderOpen(i), done=state.completed[i];
  const on=hoverKey==='folder:'+i;
  if(on){ Rf(c.x,c.y,c.w,c.h, open?'rgba(255,255,255,0.30)':'rgba(16,20,40,0.35)');
          border(c.x,c.y,c.w,c.h,open?C.white:C.gray,1); }
  const key = done ? ('folderDone'+AGES[i].age) : (open?'folderOpen':'folderLock');
  // 图标居中在上，名称居中在图标正下方；状态文字（SLOT / LOCKED）已取消，
  // 锁定与完成状态只靠图标本身和名称颜色区分。
  const ix=c.x+(c.w-g.iconW)/2;
  D(key, ix, c.y, g.iconW, g.iconH, undefined, false);
  const label=fitLine(folderLabel(i), c.w-4, 8);
  ctextOutline(label, c.x+c.w/2, c.y+g.iconH+g.gap, 8,
        done?C.gold:(open?C.white:C.silver), 'center');
  reg('folder:'+i, c.x,c.y,c.w,c.h, ()=>{ if(open) openFolder(i); else lockedModal(i); });
}

function drawDressup(){
  const win=winRect();
  vBlock(null);            // 模态窗口：阻止点击穿透到桌面文件夹 / 任务栏
  // 遮罩：桌面变暗，突出右侧窗口
  Rf(VIEW.x,VIEW.y,VIEW.w,VIEW.h,'rgba(10,14,32,0.42)');
  // 窗口外框 + 标题栏
  bevel(win.x-2,win.y-14,win.w+4,win.h+16,C.silver);
  Rf(win.x,win.y-12,win.w,12,C.blueD); Rf(win.x,win.y-12,win.w,2,C.blueL);
  ctext('SAVE SLOT  ·  '+AGES[state.age].label+'  ·  '+AGES[state.age].place,
        win.x+6,win.y-10,8,C.white,'left',false,false);
  const xw=14,xh=14;
  D('closeBtn', win.x+win.w-xw-3, win.y-13, xw, xh, undefined, false);
  reg('win:close',win.x+win.w-xw-5,win.y-14,xw+6,xh+4,()=>{state.screen='DESKTOP';pauseMusic();});
  // 场景（背景 + 换妆台为同 3:2 画布图层）
  ctx.save(); ctx.beginPath(); ctx.rect(win.x,win.y,win.w,win.h); ctx.clip();
  Dcover('bg'+AGES[state.age].age, win.x,win.y,win.w,win.h, true);
  D('stage'+AGES[state.age].age, win.x,win.y,win.w,win.h, undefined, true);
  const cr=charRect(win);
  const baseChar = state.makeup[state.age] && ready('makeup'+AGES[state.age].age)
                 ? 'makeup'+AGES[state.age].age : 'char'+AGES[state.age].age;
  // 三段绘制：道具在人物身后 → 人物立绘 → 服饰在人物之上。
  // 手持/使用中道具与 18 岁书堆/MacBook 由 isBehind() 归入第一段，不再遮盖人物与衣服。
  const worn = currentItems().filter(x=>state.worn[x.id]);
  const byZ=(a,b)=>layerZ(a,worn)-layerZ(b,worn);
  const paintLayer=(x)=>{
    const p=PROP_PLACE[x.id];
    if(p){ Dfit(layerKeyOf(x), win.x+win.w*p.x, win.y+win.h*p.y,
                win.w*p.w, win.h*p.h, true); return; }
    const s=x.layerScale||1, dy=x.layerDY||0;   // layerDY：向上为负，微调图层贴合肩线
    if(s===1) D(layerKeyOf(x), cr.x,cr.y+dy,cr.w,cr.h, undefined, true);
    else { const dw=cr.w*s, dh=cr.h*s;
           D(layerKeyOf(x), cr.x+(cr.w-dw)/2, cr.y+(cr.h-dh)/2+dy, dw,dh, undefined, true); }
  };
  worn.filter(isBehind).sort(byZ).forEach(paintLayer);
  D(baseChar, cr.x,cr.y,cr.w,cr.h, undefined, true);
  worn.filter(x=>!isBehind(x)).sort(byZ).forEach(paintLayer);
  ctx.restore();
  border(win.x,win.y,win.w,win.h,C.ink,2);
  // 左上角音乐按钮、左下角存档按钮
  const mb=16;
  D('musicBtn', win.x+6, win.y+6, mb, mb, state.muted?0.45:1, false);
  reg('scene:music',win.x+6,win.y+6,mb,mb,toggleMusic);
  const sb=saveBtnRect(win);
  D('saveBtn', sb.x, sb.y, sb.w, sb.h, undefined, false);
  if(hoverKey==='scene:save') border(sb.x,sb.y,sb.w,sb.h,C.gold,2);
  reg('scene:save',sb.x,sb.y,sb.w,sb.h,saveSlot);
  // WARDROBE 面板
  drawWardrobe(win);
}

function drawWardrobe(win){
  const g=gridOf(win), wr=g.wr;
  // 透明底：不填充任何白色面板，也不画标题下的白色分隔线，
  // 只保留蓝色像素圆角线框（两条 border 拼出圆角）与 WARDROBE 标题。
  border(wr.x,wr.y+4,wr.w,wr.h-8,C.blueL,1);
  border(wr.x+4,wr.y,wr.w-8,wr.h,C.blueL,1);
  // 15 岁背景偏浅，标题换白色更显眼（其余年龄段保持深蓝）
  ptext('WARDROBE', wr.x+12, wr.y+7, 2, state.age===3?C.white:C.blueD, true);
  for(const c of g.cells){
    // 已穿上的可穿戴物品：图标从衣橱隐藏，格位保留（其余物品不挪位）。
    // 想脱下时从人物身上往外拖，图标会自动回到这一格。
    if(wardrobeHidden(c.item)) continue;
    const on=hoverKey==='item:'+c.item.id;
    const worn=!!state.worn[c.item.id] || (c.item.slot==='makeup'&&state.makeup[state.age]);
    // 悬停 / 使用中也只给边框，不再铺半透明色块，避免透明底被重新盖住
    if(on||worn) border(c.x+1,c.y+1,c.w-2,c.h-2,worn?C.gold:C.white,1);
    const pad=Math.min(c.w,c.h)*0.12;
    Dfit(resolveKey(c.item,'icon'), c.x+pad,c.y+pad,c.w-2*pad,c.h-2*pad, true);
    reg('item:'+c.item.id, c.x,c.y,c.w,c.h, ()=>onItemClick(c.item));
  }
}
function onItemClick(item){
  if(!itemAvailable(item)) return;   // 分支未解锁的物品不应被任何入口触发
  if(item.kind==='wear') return;     // 可穿戴物品已改为拖拽，单击不再穿脱
  // 18 岁书堆 / MacBook：点击即放到人物身后（源图自身已按全画布定位好方位）
  if(item.behind) state.worn[item.id]=true;
  if(item.kind==='makeup'){ wear(item); return; }
  if(item.kind==='tip') return;
  if(item.kind==='choice'){ openChoiceModal(item); return; }
  openItemModal(item);
  if(item.kind==='popup') wear(item);        // 弹窗同时把「使用中」道具放上人物
}

/* ------------------------- 悬浮说明 / 物品弹窗 ------------------------- */
function drawTooltip(){
  const r=state.tip; if(!r) return;
  const item=r.item; if(!item.tip) return;
  const maxW=Math.min(150,VIEW.w*0.34);
  // 无描述物品（如 Cross necklace）悬浮框只显示名称，不留空行
  const lines=item.desc?wrap(item.desc,maxW-12,8).slice(0,6).map(l=>fitLine(l,maxW-12,8)):[];
  // 按真实文本宽度收缩：只有名称（如 Pink top）或短描述的物品不该占满整条长框
  ctx.font='9px '+FONT;
  let need=ctx.measureText(item.name).width;
  ctx.font='8px '+FONT;
  lines.forEach(l=>{ need=Math.max(need,ctx.measureText(l).width); });
  const w=Math.max(46,Math.min(maxW,Math.ceil(need)+14)), h=18+lines.length*11+6;
  let x=r.x+8, y=r.y+8;
  if(x+w>VIEW.x+VIEW.w) x=r.x-w-8;
  if(y+h>VIEW.y+VIEW.h) y=r.y-h-8;
  x=Math.max(VIEW.x+2,x); y=Math.max(VIEW.y+2,y);
  // 高透明底 + 细边框（不铺实心奶油白），文字另加亮描边保证任何背景都读得清
  Rf(x,y,w,h,TIP_BG);
  border(x,y,w,h,TIP_EDGE,1);
  Rf(x,y,w,1,TIP_LIGHT); Rf(x,y,1,h,TIP_LIGHT);
  ctextHalo(item.name,x+6,y+4,9,C.blueD,'left',1,true);
  lines.forEach((l,i)=>ctextHalo(l,x+6,y+17+i*11,8,C.ink,'left',1));
  return {x,y,w,h};
}
/* 拖拽预览：半透明服饰图标跟随指针；从衣橱拖时高亮人物落点，

/* ---------------- 统一弹窗：一个窗口 = 标题栏(名称) + 上图片 + 下文字/选项 ----------------
 * 旧版 choice 物品会同时弹「详情」+「选项」两个窗口，描述还重复两遍；
 * 新版 4 张素材去掉了 XP 标题栏，正好作为合并弹窗的下半区（自带描述 + 两个按钮）。 */
const POP = {pink:'#f990c3', cyan:'#93d5da', navy:'#133055'};
const MODAL_TITLE_H = 17;
const CHOICE_RATIO = 900/400;     // 新版 4 张选项素材统一构建成 900x400
function modalRect(){
  // 整体缩小：宽度 306→248 后选项素材按 900:400 等比变矮，
  // 反而腾出更多高度给物品大图 —— 图片放大、粉色留白减少。
  const w=Math.min(VIEW.w*0.52,248), h=Math.min(VIEW.h*0.84,226);
  return {x:VIEW.x+(VIEW.w-w)/2, y:VIEW.y+(VIEW.h-h)/2-5, w, h};
}
/* 选项素材：铺满弹窗内容区宽度并贴底，浅蓝边与弹窗内框重合，
 * 和上半粉色区连成一个整体。严格保持 900:400 比例，按钮归一化坐标才不会偏移。 */
function choiceImageRect(r){
  const w=r.w-8, h=w/CHOICE_RATIO;
  return {x:r.x+4, y:r.y+r.h-4-h, w, h};
}
/* 纯详情弹窗：描述框压成底部一条窄横幅，把空间让给上方的物品大图 */
function itemDescRect(r){
  const w=r.w-12, h=Math.min(r.h*0.15,34);
  return {x:r.x+6, y:r.y+r.h-4-h, w, h};
}
function modalLowerRect(r,isChoice){ return isChoice?choiceImageRect(r):itemDescRect(r); }
/* 雏菊 / 宝石 / 笔记本三个二选一弹窗的物品大图：
   原先大图被 Dfit 塞满「标题栏下沿 ↔ 选项面板上沿」整条带，顶边紧贴标题栏。
   这里把大图略微放大并整体下移一点：顶边留出 4px 呼吸位，底边探入选项面板
   顶部的粉色空白（描述文字在更下方，不会被盖住）。面板画完后再画大图，
   否则下探的部分会被面板盖掉。*/
function choiceBigImageRect(r){
  const imgTop=r.y+4+MODAL_TITLE_H+2;
  const baseH=Math.max(24,choiceImageRect(r).y-imgTop-2);
  const h=baseH*1.18, top=imgTop+4;
  return {x:r.x+(r.w-h)/2, y:top, w:h, h};
}
function drawUnifiedModal(m){
  const item=m.item, r=modalRect(), isChoice=(m.kind==='choice');
  // XP 风格外框：深蓝边 + 浅蓝内边 + 粉底（与新版选项素材同色）
  Rf(r.x,r.y,r.w,r.h,POP.navy);
  Rf(r.x+2,r.y+2,r.w-4,r.h-4,POP.cyan);
  Rf(r.x+4,r.y+4,r.w-8,r.h-8,POP.pink);

  // 标题栏：物品名称只在这里出现，下方文字区不再重复
  const ty=r.y+4, th=MODAL_TITLE_H;
  Rf(r.x+4,ty,r.w-8,th,C.cyan);
  Rf(r.x+4,ty+th-1,r.w-8,1,POP.navy);
  Rf(r.x+9,ty+5,7,7,POP.navy);
  ctext(fitLine(String(item.name).toUpperCase(),r.w-62,9),r.x+22,ty+4,9,POP.navy,'left',false,true);
  const bw=11,bh=9,by=ty+4;
  let closeX=0;
  for(let i=0;i<3;i++){
    const bx=r.x+r.w-6-(3-i)*(bw+3);
    Rf(bx,by,bw,bh,C.silver); border(bx,by,bw,bh,POP.navy,1);
    if(i===2){ ctext('X',bx+bw/2,by+1,7,POP.navy,'center',false); closeX=bx; }
  }
  reg('pop:close',closeX,by,bw+3,bh+3,isChoice?()=>choose(item,false):closeModal);

  // 纯详情弹窗的大图画在这里；choice 弹窗的大图要压到选项面板上方，
  // 所以推迟到面板（及其边框抹除）画完之后再画，见下方 isChoice 分支。
  const low=isChoice?choiceImageRect(r):itemDescRect(r);
  const imgTop=ty+th+2, imgH=Math.max(24,low.y-imgTop-2);
  if(!isChoice) Dfit(resolveKey(item,'big'),r.x+4,imgTop,r.w-8,imgH,true);

  // 下方：choice 贴选项素材（描述由素材自带）；item 只画描述文字
  if(isChoice){
    const opt=choiceImageRect(r);
    D(resolveKey(item,'choiceImg'),opt.x,opt.y,opt.w,opt.h,undefined,false);
    // 抹掉素材自带的浅蓝四边框：它已贴底铺满，抹掉后与上半区是同一块粉底，
    // 只剩描述文字和两个按钮浮在上面，窗口看起来是一个整体而非两个叠框。
    // 素材四周有约 4 设计像素白边 + 浅蓝/深蓝双描边，e 要盖过整圈才不留残线。
    const e=10;
    Rf(opt.x,opt.y-2,opt.w,e+2,POP.pink);
    Rf(opt.x,opt.y+opt.h-e,opt.w,e,POP.pink);
    Rf(opt.x,opt.y-2,e,opt.h+2,POP.pink);
    Rf(opt.x+opt.w-e,opt.y-2,e,opt.h+2,POP.pink);
    // 最后画放大并下移的物品大图：盖在面板顶部粉色留白上，与上半区连成一体
    const big=choiceBigImageRect(r);
    Dfit(resolveKey(item,'big'),big.x,big.y,big.w,big.h,true);
    const rects=choiceRects(opt,item.choiceImg);
    if(hoverKey==='choice:yes') border(rects.yes.x,rects.yes.y,rects.yes.w,rects.yes.h,C.white,2);
    if(hoverKey==='choice:no')  border(rects.no.x, rects.no.y, rects.no.w, rects.no.h, C.white,2);
    reg('choice:yes',rects.yes.x,rects.yes.y,rects.yes.w,rects.yes.h,()=>choose(item,true));
    reg('choice:no', rects.no.x, rects.no.y, rects.no.w, rects.no.h, ()=>choose(item,false));
  } else {
    Rf(low.x,low.y,low.w,low.h,'rgba(255,247,238,0.93)');
    border(low.x,low.y,low.w,low.h,C.pinkD,1);
    const ds=Math.max(7,Math.min(9,r.w/28));
    const maxLines=Math.max(0,Math.floor((low.h-8)/(ds+2)));
    if(item.desc && maxLines>0){
      const lines=wrap(item.desc,low.w-10,ds).slice(0,maxLines)
        .map(l=>fitLine(l,low.w-10,ds));
      // 描述垂直居中：单行短说明时下半区不会留出一大片空白。
      // 弹窗尺寸与 choice 保持一致，切换物品时窗口不跳动。
      const startY=low.y+Math.max(2,(low.h-lines.length*(ds+2)+2)/2);
      lines.forEach((l,i)=>ctext(l,low.x+5,startY+i*(ds+2),ds,C.ink,'left',false));
    }
  }
  return r;
}
/* ------------------------- 二选一弹窗按钮 -------------------------
 * 数值是对「裁掉白边、统一缩到 900x400」的新版 4 张素材逐像素实测的
 * 按钮填充色包围盒，归一化到 choiceImageRect()（合并弹窗的下半区矩形）。
 * 格式 [x0,y0,x1,y1]。四张素材的按钮宽高、纵向位置都不一样，
 * 旧版统一用一套坐标会框歪或框不全；CHOICE_PAD 再外扩覆盖按钮深色描边。
 *
 * 更关键：素材的「左右语义」并不统一，不能一律按「左 yes / 右 no」注册：
 *   chooseDaisy  左 KEEP IT / 右 LEAVE IT                    → 左 yes
 *   chooseGem    左 STOP IT / 右 PICK IT UP                  → 右 yes
 *   chooseClass  左 PAY ATTENTION IN CLASS / 右 DRAW PICTURES → 右 yes
 *   chooseRemake 左 REMAKE T-shirt / 右 CHOOSE COMFORTABLE OUTFITS → 左 yes
 * ------------------------------------------------------------------- */
const CHOICE_UI = {
  chooseDaisy: {
    yes:[0.1744,0.7025,0.3244,0.8225], no:[0.6556,0.7025,0.8056,0.8225],
  },
  chooseGem: {
    yes:[0.6556,0.6950,0.8056,0.8200], no:[0.1744,0.6975,0.3244,0.8200],
  },
  chooseClass: {
    yes:[0.7111,0.6450,0.8611,0.8050], no:[0.1278,0.6525,0.3144,0.8125],
  },
  chooseRemake: {
    yes:[0.1744,0.6525,0.3244,0.8750], no:[0.6556,0.6525,0.8611,0.8675],
  },
};
const CHOICE_PAD = 2;   // 白框外扩 2 设计像素，按钮完整落在白框内
function choiceRects(r, imgKey){
  const ui = CHOICE_UI[imgKey] || CHOICE_UI.chooseDaisy;
  const cvt = b => ({
    x:r.x + r.w*b[0] - CHOICE_PAD,
    y:r.y + r.h*b[1] - CHOICE_PAD,
    w:r.w*(b[2]-b[0]) + CHOICE_PAD*2,
    h:r.h*(b[3]-b[1]) + CHOICE_PAD*2,
  });
  return {yes:cvt(ui.yes), no:cvt(ui.no)};
}
function choose(item,yes){
  state.choices[item.choice]=yes;
  if(item.id==='a12_notebook'){
    // 笔记本：两种选择都放置对应版本，X 等同 pay attention
    state.worn[item.id]=true; state.slotOwner[item.slot]=item.id;
  } else if(yes && item.onYes!=='none'){
    state.worn[item.id]=true;
    if(item.slot) state.slotOwner[item.slot]=item.id;
  } else {
    delete state.worn[item.id];
  }
  if(item.id==='a12_notebook' && !yes){
    // 选了「认真听课」或点 X：12 岁没有涂鸦，15 岁的 REMAKE T恤分支作废
    state.choices.remake=false;
    pruneHiddenWear();
  }
  closeModal();
}
function drawModal(){
  vBlock(null);
  if(state.modal.kind==='info'){
    // ABOUT 文案很长：宽弹窗 + 按真实字宽自动折行，高度随行数自适应
    const wide=!!state.modal.wide;
    const w=Math.min(VIEW.w*(wide?0.70:0.52), wide?336:220);
    const fs=wide?8:9, lh=fs+5, maxW=w-20;
    const rows=[];
    (state.modal.lines||[]).forEach(l=>{
      // 只有 ABOUT 这类长文案才按宽度折行；锁定提示 / 音乐提示保持原文不截断
      if(wide) wrap(l,maxW,fs).forEach(p=>rows.push(fitLine(p,maxW,fs)));
      else rows.push(l);
    });
    const h=Math.max(92, 26+rows.length*lh+30);
    const x=VIEW.x+(VIEW.w-w)/2, y=VIEW.y+(VIEW.h-h)/2;
    bevel(x,y,w,h,C.silver);
    Rf(x+2,y+2,w-4,17,C.blueD);
    ctext(state.modal.title,x+8,y+4,10,C.white,'left',false);
    // 最后一行是署名（Cindy Shan）时按惯例靠右对齐；正文仍左对齐。
    // 按弹窗标题识别 ABOUT，保证菜单入口与外部直接 infoModal 调用行为一致。
    const isSign = i=>i===rows.length-1 && (state.modal.sign || state.modal.title==='ABOUT');
    rows.forEach((l,i)=>ctext(l,isSign(i)?x+w-10:x+10,y+26+i*lh,fs,C.ink,isSign(i)?'right':'left',false));
    const bw=54,bh=18,bx=x+w-bw-8,by=y+h-bh-7;
    bevel(bx,by,bw,bh,C.gold); ctext('OK',bx+bw/2,by+4,9,C.ink,'center',false);
    reg('modal:ok',bx,by,bw,bh,closeModal);
    const xx=x+w-18;
    reg('modal:x',xx,y+2,16,15,closeModal);
    return;
  }
  // 详情弹窗与选项弹窗已合并：item / choice 都走同一个 drawUnifiedModal()
  drawUnifiedModal(state.modal);
}

/* ------------------------- 存档 / 解锁 / 结局 ------------------------- */
function openFolder(i){
  if(!folderOpen(i)) { lockedModal(i); return; }
  cancelDrag();
  state.age=i; state.screen='DRESSUP'; state.startMenu=false; state.modal=null;
  restore(state.saved[i]);
  // 切换年龄段：强制恢复播放状态，上一曲归零，从头播放当前年龄段曲目
  state.muted=false;
  stopMusic();
  playMusic();
}
function saveSlot(){
  cancelDrag();
  state.saved[state.age]=snapshot();
  state.completed[state.age]=true;
  if(state.age+1<5) state.unlocked=Math.max(state.unlocked,state.age+2);
  state.saveAnim=24;
  state.screen='DESKTOP'; pauseMusic();
  // 谢幕只在「首次集齐 5 个存档点」时播放一次。之后自由重玩期间回到前序
  // 存档点换装再保存，只更新该存档并回到桌面，不重新触发结局滚动。
  if(!state.endingShown && state.completed.every(Boolean)){
    state.screen='ENDING'; state.endingTick=0; state.freePlay=true;
    state.endingShown=true; state.saveAnim=0;
  }
}
function freePlayAgain(){
  cancelDrag();
  state.screen='DESKTOP'; state.freePlay=true; state.unlocked=5;
  state.endingTick=0; state.modal=null;
}

/* ------------------------- 结局 -------------------------
 * 设计稿：谢幕是「游戏界面内按顺序滚动展示图片1 → 图片2」，不是占满整屏。
 * 因此保留 XP 桌面与换装窗口，视口正好一张图大小，内容 = 图1 + 图2 竖排，
 * 滚动一个视口高：起点只见图1，终点只见图2。
 * END_FRAMES：原实现约 300 帧（≈5 秒）滚完，这里放慢 4 倍到 1200 帧。
 * ------------------------------------------------------------------- */
const END_FRAMES = 1200;
function endingScroll(){
  const win=winRect(), vh=win.h-8;
  return {win, vh, scroll: vh*Math.min(1, state.endingTick/END_FRAMES)};
}
function drawEnding(){
  // 桌面 / 五个存档点 / 任务栏仍在，只是被压暗；谢幕发生在换装窗口里
  drawDesktop();
  Rf(VIEW.x,VIEW.y,VIEW.w,VIEW.h,'rgba(10,14,32,0.42)');
  const {win,scroll}=endingScroll();
  // 与换装窗口一致的外框与标题栏
  bevel(win.x-2,win.y-14,win.w+4,win.h+16,C.silver);
  Rf(win.x,win.y-12,win.w,12,C.blueD); Rf(win.x,win.y-12,win.w,2,C.blueL);
  ctext('SAVE SLOT  ·  THE END', win.x+6,win.y-10,8,C.white,'left',false,false);
  const xw=14,xh=14;
  D('closeBtn', win.x+win.w-xw-3, win.y-13, xw, xh, undefined, false);
  // 视口：一张谢幕图大小；两张图上下拼接，只滚动一个视口高
  const vx=win.x+4, vy=win.y+4, vw=win.w-8, vh=win.h-8;
  ctx.save(); ctx.beginPath(); ctx.rect(vx,vy,vw,vh); ctx.clip();
  D('endRoll1', vx, vy-scroll,      vw, vh, undefined, true);
  D('endRoll2', vx, vy+vh-scroll,   vw, vh, undefined, true);
  ctx.restore();
  border(vx,vy,vw,vh,C.ink,1);
  state.endingTick++;
  // 挡住桌面文件夹 / 任务栏的点击区（vBlock 最后注册，从后往前命中它）
  vBlock(null);
  reg('end:x', win.x+win.w-xw-5, win.y-14, xw+6, xh+4, freePlayAgain);
  // 滚到底才放出「Free play once again」：按钮图形来自滚动图片2 自带
  if(scroll>=vh-0.5){
    const bx=vx+vw*0.375, by=vy+vh*0.765, bw=vw*0.245, bh=vh*0.07;
    reg('end:again',bx,by,bw,bh,freePlayAgain);
    border(bx,by,bw,bh,C.pinkD,1);
    if(hoverKey==='end:again' || Math.floor(tick/28)%2===0)
      border(bx,by,bw,bh,C.gold,2);
  }
}

/* ------------------------- 主循环 ------------------------- */
let tick=0, lastCursor='';
function draw(){
  setTransform();
  regions=[];
  vFill(C.navy);
  if(state.screen==='TITLE') drawTitle();
  else if(state.screen==='ENDING') drawEnding();
  else {
    drawDesktop();
    if(state.screen==='DRESSUP') drawDressup();
  }
  if(state.startMenu && state.screen==='DESKTOP'){
    vBlock(()=>{state.startMenu=false;});
    drawStartMenu();
  }
  if(state.modal) drawModal();
  // 悬浮说明（只在换装窗口且无弹窗时）
  state.tip=null;
  if(state.screen==='DRESSUP' && !state.modal && !state.startMenu && !state.drag){
    const hr=hit(mouse.x,mouse.y);
    if(hr && hr.key.indexOf('item:')===0){
      const item=ITEM_BY_ID[hr.key.slice(5)];
      state.tip={item,x:mouse.x,y:mouse.y};
    }
  }
  drawTooltip();
  drawDrag();
  const hr=state.drag?null:hit(mouse.x,mouse.y);
  hoverKey=hr?hr.key:null;
  const cur = state.drag ? 'grabbing'
    : ready('cursor')
    ? 'url("'+IMG.cursor+'") 0 0, '+(hr?'pointer':'default')
    : (hr?'pointer':'default');
  if(cur!==lastCursor){ canvas.style.cursor=cur; lastCursor=cur; }
  tick++;
  requestAnimationFrame(draw);
}

/* ------------------------- 输入 ------------------------- */
canvas.addEventListener('pointermove',e=>{
  mouse=toCanvas(e);
  if(state.drag) moveDrag(mouse.x,mouse.y);
});
canvas.addEventListener('pointerdown',e=>{
  mouse=toCanvas(e);
  const r=hit(mouse.x,mouse.y);
  if(state.screen==='DRESSUP' && !state.modal && !state.startMenu){
    // ① 衣橱里的可穿戴物品：按下即开始拖拽，不再「一点就穿上」
    if(r && r.key.indexOf('item:')===0){
      const item=ITEM_BY_ID[r.key.slice(5)];
      if(item && draggable(item) && !wardrobeHidden(item)){
        beginDrag('wardrobe',item,mouse.x,mouse.y);
        try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
        return;
      }
    }
    // ② 人物身上已穿的物品：按住往外拖＝脱下。
    //    音乐/存档/关闭等 UI 命中区优先，只有落在空背景上才起拖。
    if((!r || r.key==='view:block') && inChar(mouse.x,mouse.y)){
      const item=wornWearAt(mouse.x,mouse.y);
      if(item){
        beginDrag('char',item,mouse.x,mouse.y);
        try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
        return;
      }
    }
  }
  if(r&&r.fn) r.fn();          // 其余物品、按钮、弹窗：保持单击交互
});
canvas.addEventListener('pointerup',e=>{
  mouse=toCanvas(e);
  if(state.drag) endDrag(mouse.x,mouse.y);
});
canvas.addEventListener('pointercancel',cancelDrag);
canvas.addEventListener('pointerleave',()=>{mouse={x:-9999,y:-9999};});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    cancelDrag();
    if(state.modal) closeModal();
    else if(state.startMenu) state.startMenu=false;
    else if(state.screen==='DRESSUP'){ state.screen='DESKTOP'; pauseMusic(); }
  }
});

/* ------------------------- 对外接口 ------------------------- */
window.PrincessGame = {
  get assets(){ return IMG; },
  get state(){ return state; },
  get AGES(){ return AGES; },
  get WARDROBES(){ return WARDROBES; },
  get wardrobeLayout(){ return WARDROBE_LAYOUT; },
  get view(){ return Object.assign({},VIEW); },
  get pixelDensity(){ return PX; },
  get propPlace(){ return PROP_PLACE; },
  get choiceUI(){ return CHOICE_UI; },
  get choicePad(){ return CHOICE_PAD; },
  get regions(){ return regions; },
  get tipBg(){ return TIP_BG; },
  get tipHalo(){ return TIP_HALO; },
  get folderLabels(){ return AGES.map((a,i)=>folderLabel(i)); },
  get saveButton(){ return Object.assign({},SAVE_BTN); },
  get drag(){ return state.drag; },
  choiceRects, modalRect, choiceImageRect, itemDescRect, modalLowerRect, choiceBigImageRect, drawUnifiedModal,
  get endingFrames(){ return END_FRAMES; },
  get about(){ return ABOUT_LINES; },
  isBehind, layerKeyOf,
  charRect, inChar, saveBtnRect, folderGeom, folderCell, folderLabel,
  draggable, wardrobeHidden, wornWearList, wornWearAt, removeWear,
  beginDrag, moveDrag, endDrag, cancelDrag,
  setPixelDensity, resize,
  setAsset(key,url){
    IMG[key]=url; const i=new Image(); i.src=url; IM[key]=i;
  },
  setCharacter(ageIdx,url){ this.setAsset('char'+AGES[ageIdx].age,url); },
  setItem(id,url){ this.setAsset('L_'+id,url); this.setAsset('T_'+id,url); },
  goto(screen){ state.screen=screen; },
  reset:resetAll,
};
applyDensity();
draw();
</script>
